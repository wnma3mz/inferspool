<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">InferSpool</title>
  <desc id="desc">Two connected inference queue paths forming a continuous spool.</desc>
  <defs>
    <linearGradient id="surface" x1="8" y1="5" x2="55" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.48" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="line" x1="14" y1="13" x2="50" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1D4ED8" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="54" height="54" rx="16" fill="url(#surface)" filter="url(#shadow)"/>
  <path d="M17 17h16.5a8.5 8.5 0 0 1 0 17H28a8 8 0 0 0 0 16h19" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <path d="M47 47H30.5a8.5 8.5 0 0 1 0-17H36a8 8 0 0 0 0-16H17" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" opacity="0.88"/>
  <circle cx="17" cy="17" r="3" fill="#BFDBFE"/>
  <circle cx="47" cy="47" r="3" fill="#FFFFFF"/>
</svg>
